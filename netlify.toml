[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/build"

[dev]
  command = "cd frontend && npm start"
  targetPort = 3000
  port = 8889
  publish = "frontend/build"
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  CI = "false"

[context.production.environment]
  NODE_ENV = "production"
